apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: gram-thread

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: viprana21/gram-thread-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"